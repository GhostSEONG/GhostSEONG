
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 체스 대결</title>
    
    <!-- 체스 UI 라이브러리 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohOuzBXS4k/bV0BFambg0I0fMpqsM7bR3zGtsQ+324OqtA*d8B" crossorigin="anonymous">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ecf0f1;
            margin-bottom: 10px;
        }

        .status-box {
            background-color: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* 체스보드 컨테이너 */
        #myBoard {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #34495e;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #c0392b;
        }

        .btn-undo {
            background-color: #3498db;
        }
        .btn-undo:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>♞ AI 체스 대결</h1>
        <div class="status-box" id="status">흰색(당신) 차례입니다</div>
    </div>

    <!-- 체스판이 그려질 공간 -->
    <div id="myBoard"></div>

    <div class="controls">
        <button class="btn-undo" id="undoBtn">무르기 (Undo)</button>
        <button id="startBtn">새 게임</button>
    </div>

    <!-- JQuery (Chessboard.js의 필수 의존성) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- 체스 로직 라이브러리 (chess.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <!-- 체스 UI 라이브러리 (chessboard.js) -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // AI 턴 처리 함수 (단순히 기물을 잡을 수 있으면 잡고, 아니면 랜덤으로 두는 AI)
        function makeAIMove() {
            var possibleMoves = game.moves();

            // 게임 오버 상태면 종료
            if (possibleMoves.length === 0) return;

            // x(capture)가 포함된 공격 가능한 수가 있는지 확인
            var capturingMoves = possibleMoves.filter(move => move.includes('x'));
            var move = null;

            // 먹을 게 있으면 우선적으로 먹고, 없으면 랜덤하게 둠
            if (capturingMoves.length > 0) {
                move = capturingMoves[Math.floor(Math.random() * capturingMoves.length)];
            } else {
                move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

            // AI가 둔 수를 로직에 반영
            game.move(move);
            // 바뀐 보드판을 화면에 업데이트
            board.position(game.fen());
            updateStatus();
        }

        // 유저가 기물을 집어 들었을 때 (드래그 시작)
        function onDragStart (source, piece, position, orientation) {
            // 게임이 끝났거나, 내(흰색) 차례가 아니거나, 검은색 기물을 만지려고 하면 차단
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        // 유저가 기물을 내려놓았을 때 (드롭)
        function onDrop (source, target) {
            // 내려놓은 위치로 이동이 유효한지 체크
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // 폰이 끝까지 가면 무조건 퀸으로 승급하도록 기본값 설정
            });

            // 규칙에 어긋난 이동이면 원래 자리로 튕겨냄
            if (move === null) return 'snapback';

            updateStatus();

            // 유저 턴이 무사히 끝났으면 0.3초 뒤에 AI 턴 실행
            window.setTimeout(makeAIMove, 300);
        }

        // 유저가 둔 기물이 부드럽게 제자리에 안착하도록 업데이트
        function onSnapEnd () {
            board.position(game.fen());
        }

        // 현재 보드 상태와 체크메이트 여부 등을 텍스트로 업데이트
        function updateStatus () {
            var statusHTML = '';
            var moveColor = '흰색(당신)';
            if (game.turn() === 'b') moveColor = '검은색(AI)';

            if (game.in_checkmate()) {
                statusHTML = '게임 오버! ' + moveColor + '이(가) 졌습니다.';
            } else if (game.in_draw()) {
                statusHTML = '무승부입니다.';
            } else {
                statusHTML = moveColor + ' 차례입니다';
                if (game.in_check()) {
                    statusHTML += ' <span style="color:#e74c3c;">(체크!)</span>';
                }
            }
            $status.html(statusHTML);
        }

        // 체스판 UI 설정
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };

        board = Chessboard('myBoard', config);
        updateStatus();

        // 버튼 이벤트 리스너
        $('#startBtn').on('click', function() {
            game.reset();
            board.start();
            updateStatus();
        });

        $('#undoBtn').on('click', function() {
            // 무르기를 누르면 AI가 둔 것과 내가 둔 것 2수를 뒤로 되돌림
            game.undo();
            game.undo();
            board.position(game.fen());
            updateStatus();
        });

    </script>
</body>
</html>
