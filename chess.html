<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 체스 대결</title>
    
    <!-- 체스 UI 라이브러리 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohOuzBXS4k/bV0BFambg0I0fMpqsM7bR3zGtsQ+324OqtA*d8B" crossorigin="anonymous">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ecf0f1;
            margin-bottom: 10px;
        }

        .status-box {
            background-color: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* 체스보드 컨테이너 */
        #myBoard {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #34495e;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #c0392b;
        }

        .btn-undo {
            background-color: #3498db;
        }
        .btn-undo:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>♞ AI 체스 대결</h1>
        <div class="status-box" id="status">흰색(당신) 차례입니다</div>
    </div>

    <!-- 체스판이 그려질 공간 -->
    <div id="myBoard"></div>

    <div class="controls">
        <button class="btn-undo" id="undoBtn">무르기 (Undo)</button>
        <button id="startBtn">새 게임</button>
    </div>

    <!-- JQuery (Chessboard.js의 필수 의존성) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- 체스 로직 라이브러리 (chess.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <!-- 체스 UI 라이브러리 (chessboard.js) -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

        // AI 턴 처리 함수
        function makeAIMove() {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            var capturingMoves = possibleMoves.filter(move => move.includes('x'));
            var move = null;

            if (capturingMoves.length > 0) {
                move = capturingMoves[Math.floor(Math.random() * capturingMoves.length)];
            } else {
                move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

            game.move(move);
            board.position(game.fen());
            updateStatus();
        }
