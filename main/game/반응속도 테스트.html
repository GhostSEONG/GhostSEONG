<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응속도 테스트 - 내 반응속도는 0.1초? 프로게이머 수준일까?</title>
    <!-- 애드센스 승인을 위한 메타 태그 (SEO 최적화) -->
    <meta name="description" content="인간의 평균 반응속도는 약 250ms입니다. 당신의 반응속도를 빠르고 정확하게 측정해보세요. 프로게이머 수준인지 테스트하고 결과를 공유해보세요.">
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        /* 모바일에서 더블 탭 줌 방지 */
        #game-area { touch-action: manipulation; }
        
        /* 부드러운 배경색 전환 애니메이션 */
        .transition-bg { transition: background-color 0.1s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- 네비게이션 바 (GNB) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 및 사이트 명 -->
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <svg class="h-8 w-8 text-blue-600 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span class="font-bold text-xl tracking-tight text-gray-900">반응속도 테스트</span>
                </div>
                <!-- 메뉴 카테고리 (애드센스 구조용) -->
                <nav class="hidden md:flex space-x-8">
                    <a href="#" class="text-blue-600 font-medium">반응속도 테스트</a>
                </nav>
                <!-- 모바일 메뉴 버튼 (시각적 구성) -->
                <div class="md:hidden flex items-center">
                    <button class="text-gray-500 hover:text-gray-900">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-grow w-full max-w-5xl mx-auto px-4 py-8">
        
        <!-- 타이틀 섹션 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4">반응속도 테스트</h1>
            <p class="text-lg text-gray-600">화면 색상이 초록색으로 변하는 순간 최대한 빨리 클릭하세요!</p>
        </div>

        <!-- 게임 영역 (클릭/터치 영역) -->
        <div id="game-area" class="w-full h-80 sm:h-96 rounded-2xl shadow-xl flex flex-col justify-center items-center text-white text-center cursor-pointer select-none transition-bg bg-blue-500 hover:bg-blue-600 mb-12">
            <svg id="icon-start" class="w-20 h-20 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
            </svg>
            <h2 id="game-text" class="text-3xl md:text-5xl font-bold mb-2">클릭하여 시작</h2>
            <p id="game-subtext" class="text-lg md:text-xl opacity-80 mt-2">화면이 초록색으로 변하면 클릭하세요.</p>
        </div>
    </footer>

    <script>
        // DOM 요소 가져오기
        const gameArea = document.getElementById('game-area');
        const gameText = document.getElementById('game-text');
        const gameSubtext = document.getElementById('game-subtext');
        const iconStart = document.getElementById('icon-start');

        // 게임 상태 정의
        // state: 'waiting' (시작전/결과), 'ready' (빨간색, 대기), 'now' (초록색, 클릭 타이밍)
        let currentState = 'waiting'; 
        let timeoutId = null;
        let startTime = 0;

        // UI 업데이트 헬퍼 함수
        function updateUI(bgColorClass, hoverClass, title, subtitle, showIcon) {
            // 기존 색상 클래스 제거
            gameArea.classList.remove('bg-blue-500', 'hover:bg-blue-600', 'bg-red-500', 'hover:bg-red-600', 'bg-green-500', 'hover:bg-green-600');
            // 새 색상 적용
            gameArea.classList.add(bgColorClass, hoverClass);
            
            gameText.innerHTML = title;
            gameSubtext.innerHTML = subtitle;
            
            if(showIcon) {
                iconStart.style.display = 'block';
            } else {
                iconStart.style.display = 'none';
            }
        }

        // 게임 핵심 로직 함수
        function handleInteraction(e) {
            // 스페이스바 등으로 인한 스크롤 방지 및 중복 이벤트 방지
            e.preventDefault(); 

            if (currentState === 'waiting') {
                // 게임 시작 (빨간색 대기 화면으로 전환)
                currentState = 'ready';
                updateUI('bg-red-500', 'hover:bg-red-600', '기다리세요...', '초록색으로 변하면 클릭하세요!', false);
                
                // 1.5초 ~ 3.5초 사이의 랜덤 시간 후 초록색으로 변경
                const randomDelay = Math.floor(Math.random() * 2000) + 1500;
                
                timeoutId = setTimeout(() => {
                    currentState = 'now';
                    startTime = performance.now(); // 정밀한 측정 시작 시간 기록
                    updateUI('bg-green-500', 'hover:bg-green-600', '지금 클릭!!', '최대한 빨리 누르세요!', false);
                }, randomDelay);

            } else if (currentState === 'ready') {
                // 부정 출발 (초록색이 되기 전에 클릭함)
                clearTimeout(timeoutId);
                currentState = 'waiting';
                updateUI('bg-blue-500', 'hover:bg-blue-600', '너무 빠릅니다!', '초록색이 된 후에 클릭해야 합니다.<br>클릭하여 다시 시도하세요.', true);
                
            } else if (currentState === 'now') {
                // 정상적인 클릭 (반응속도 계산)
                const endTime = performance.now();
                const reactionTime = Math.round(endTime - startTime);
                
                currentState = 'waiting';
                
                // 평가 멘트
                let gradeText = "";
                if (reactionTime < 180) gradeText = "🏆 프로게이머 수준입니다!";
                else if (reactionTime < 250) gradeText = "✨ 아주 훌륭한 반사신경입니다!";
                else if (reactionTime < 300) gradeText = "👍 평균적인 반응속도입니다.";
                else gradeText = "🐢 조금 더 집중해 볼까요?";

                updateUI(
                    'bg-blue-500', 
                    'hover:bg-blue-600', 
                    `${reactionTime} ms`, 
                    `${gradeText}<br><br>클릭하여 다시 시도`, 
                    false
                );
            }
        }

        // 마우스 클릭 및 모바일 터치 이벤트 모두 지원
        gameArea.addEventListener('mousedown', handleInteraction);
        gameArea.addEventListener('touchstart', handleInteraction, { passive: false });

    </script>
</body>
</html>
