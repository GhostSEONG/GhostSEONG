
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스네이크 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none; /* 모바일 브라우저 스크롤 방지 */
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .title {
            font-size: 2rem;
            font-weight: 900;
            color: #2ecc71;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .score-board {
            display: flex;
            gap: 15px;
        }

        .score-box {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            text-align: center;
        }

        .score-label {
            font-size: 0.75rem;
            color: #bdc3c7;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 캔버스 게임 보드 */
        .game-container {
            position: relative;
            background-color: #34495e;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #1a252f;
            border-radius: 8px;
            display: block;
        }

        /* 게임 오버 화면 */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(44, 62, 80, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #27ae60;
        }

        .controls-hint {
            margin-top: 20px;
            color: #95a5a6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">SNAKE</div>
        <div class="score-board">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best-score">0</div>
            </div>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="overlay" id="overlay">
            <h2>Game Over</h2>
            <p id="final-score">Score: 0</p>
            <button onclick="resetGame()">다시 시작</button>
        </div>
    </div>

    <div class="controls-hint">방향키 또는 스와이프로 조작하세요</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const overlay = document.getElementById('overlay');
        const finalScoreElement = document.getElementById('final-score');

        // 모바일 화면에 맞게 캔버스 크기 조절
        const size = Math.min(window.innerWidth - 40, 400);
        canvas.width = size;
        canvas.height = size;

        // 게임 설정
        const gridSize = size / 20; // 20x20 그리드
        const tileCount = 20;
        
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let bestScore = localStorage.getItem('snakeBestScore') || 0;
        let gameLoop;
        let speed = 120; // 초기 속도 (밀리초)
        let isGameOver = false;
        let changingDirection = false;

        bestScoreElement.textContent = bestScore;

        function initGame() {
            // 뱀 초기 위치 (화면 중앙)
            snake = [
                {x: 10, y: 10},
                {x: 10, y: 11},
                {x: 10, y: 12}
            ];
            dx = 0;
            dy = -1; // 위로 출발
            score = 0;
            speed = 120;
            isGameOver = false;
            changingDirection = false;
            
            scoreElement.textContent = score;
            spawnFood();
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function resetGame() {
            overlay.classList.remove('active');
            initGame();
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // 먹이가 뱀 몸통에 겹치면 다시 생성
            snake.forEach(part => {
                if(part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function update() {
            if (isGameOver) return;
            changingDirection = false;

            // 뱀 머리 이동 위치 계산
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 벽 충돌 체크
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // 자기 몸 충돌 체크
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            // 머리 추가
            snake.unshift(head);

            // 먹이를 먹었는지 체크
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                spawnFood();
                
                // 속도 증가 로직
                if(score % 50 === 0 && speed > 50) {
                    clearInterval(gameLoop);
                    speed -= 10;
                    gameLoop = setInterval(update, speed);
                }
            } else {
                // 못 먹었으면 꼬리 자르기
                snake.pop();
            }

            draw();
        }

        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#1a252f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 그리기 (선택사항, 지우면 더 깔끔함)
            ctx.strokeStyle = '#2c3e50';
            for(let i=0; i<=tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 먹이 그리기
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2.5, 0, Math.PI * 2);
            ctx.fill();

            // 뱀 그리기
            snake.forEach((part, index) => {
                // 머리는 약간 다른 색
                ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';
                // 테두리 둥글게 표현을 위해 여백 조금 줌
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
                bestScoreElement.textContent = bestScore;
            }
            
            finalScoreElement.textContent = `Score: ${score}`;
            overlay.classList.add('active');
        }

        // 방향 전환 로직 (반대 방향으로는 바로 꺾지 못함)
        function changeDirection(newDx, newDy) {
            if (changingDirection) return;
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === -1 && goingRight) return;
            if (newDx === 1 && goingLeft) return;
            if (newDy === -1 && goingDown) return;
            if (newDy === 1 && goingUp) return;

            dx = newDx;
            dy = newDy;
            changingDirection = true;
        }

        // 키보드 조작
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            switch(e.key) {
                case 'ArrowLeft': case 'a': case 'A': changeDirection(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': changeDirection(1, 0); break;
                case 'ArrowUp': case 'w': case 'W': changeDirection(0, -1); break;
                case 'ArrowDown': case 's': case 'S': changeDirection(0, 1); break;
            }
        });

        // 모바일 스와이프 조작
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // 스크롤 방지
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dxTouch = touchEndX - touchStartX;
            let dyTouch = touchEndY - touchStartY;

            if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                // 좌우 스와이프
                if (dxTouch > 30) changeDirection(1, 0);
                else if (dxTouch < -30) changeDirection(-1, 0);
            } else {
                // 상하 스와이프
                if (dyTouch > 30) changeDirection(0, 1);
                else if (dyTouch < -30) changeDirection(0, -1);
            }
        });

        // 첫 화면 렌더링
        draw();
        initGame();
    </script>
</body>
</html>
